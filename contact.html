 justify-between" style="background-color: #0B1523;"><header class="fixed top-0 left-0 right-0 z-50 bg-[#0B1523]/80 backdrop-blur-xl border-b border-border-subtle/50"><div class="h-20 w-full px-margin-mobile md:px-margin lg:px-margin-desktop flex items-center justify-between"><div class="flex items-center gap-space-lg"><a class="flex items-center gap-space-sm group" data-path="showreel" href="#"></a></div><nav class="hidden md:flex items-center gap-2 lg:gap-3" data-active-classes="text-primary font-bold"><a class="px-4 py-2 rounded-lg text-base lg:text-lg font-semibold tracking-wider uppercase text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high/60 transition-all" data-path="showreel" href="index.html">SHOWREEL</a><a class="px-4 py-2 rounded-lg text-base lg:text-lg font-semibold tracking-wider uppercase text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high/60 transition-all" data-path="works" href="/works.html">WORKS</a><a class="px-4 py-2 rounded-lg text-base lg:text-lg font-semibold tracking-wider uppercase text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high/60 transition-all" data-path="services" href="/services.html">SERVICES</a><a aria-current="page" class="px-4 py-2 rounded-lg text-base lg:text-lg font-bold tracking-wider uppercase text-primary bg-primary/10 border border-primary/20 shadow-[0_0_12px_rgba(85,216,225,0.15)] transition-all" data-path="contact" href="#">CONTACT</a></nav><div class="flex items-center gap-space-md"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"></div></div></div></header><main class="w-full pt-20 bg-[#0B1523] flex-1"><section class="w-full min-h-[calc(100vh-160px)] px-margin-mobile md:px-margin lg:px-margin-desktop py-space-xl flex items-center justify-center"><div class="w-full max-w-2xl rounded-xl bg-surface-elevated shadow-[0_24px_64px_rgba(0,0,0,0.8),0_0_35px_rgba(85,216,225,0.18)] p-space-md md:p-space-xl border border-whit aceholder="your.email@example.com" required="" type="email"/></div><div class="flex flex-col gap-space-xs flex-1"><label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="contact-phone">Phone Number</label><input class="w-full px-space-md py-space-sm rounded-lg bg-surface-container-lowest border border-white/5 text-text-primary placeholder:text-text-muted/40 font-body-md focus:outline-none focus:border-primary focus:shadow-[0_0_12px_rgba(85,216,225,0.3)] transition-all" id="contact-phone" name="phone" placeholder="+44 (0) 7... or your phone number" type="tel"/></div></div><div class="flex flex-col gap-space-xs"><label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="contact-details">Details *</label><textarea class="w-full px-space-md py-space-sm rounded-lg bg-surface-container-lowest border border-white/5 text-text-primary placeholder:text-text-muted/40 font-body-md focus:outline-none focus:border-primary focus:shadow-[0_0_12px_rgba(85,216,225,0.3)] transition-all" id="contact-details" name="details" placeholder="Tell me about your project, timeline, and requirements..." required="" rows="5"></textarea></div><div class="pt-space-sm flex flex-col items-center gap-space-md"><button class="w-full inline-flex items-center justify-center gap-space-sm px-space-lg py-space-md rounded-full bg-primary text-on-primary font-label-lg text-label-lg transition-all duration-300 hover:bg-accent-electric shadow-[0_0_24px_rgba(85,216,225,0.35)] hover:shadow-[0_0_36px_rgba(0,210,211,0.6)] hover:scale-105 active:scale-95 cursor-pointer font-bold disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100" id="submit-btn" type="submit"><span class="material-symbols-outlined text-[20px]" id="submit-icon">send</span><span id="submit-text">Send Message</span></button><div class="flex items-center gap-space-xs text-text-muted font-body-md text-center"><span class="material-symbols-outlined text-[16px] text-primary">mail</span><span>Or email directly at <a class="text-primary hover:text-accent-electric underline transition-colors" href="mailto:kilvertm@gmail.com">kilvertm@gmail.com</a></span></div></div></form><script>const form = document.getElementById('contact-form');
const statusBox = document.getElementById('form-status');
const submitBtn = document.getElementById('submit-btn');
const submitText = document.getElementById('submit-text');
const submitIcon = document.getElementById('submit-icon');

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  
  submitBtn.disabled = true;
  submitIcon.textContent = 'hourglass_empty';
  submitText.textContent = 'Sending...';
  statusBox.className = 'hidden mb-space-md p-space-md rounded-lg text-sm text-center font-medium transition-all duration-300';
  statusBox.textContent = '';

  const data = new FormData(form);

  try {
    const response = await fetch(form.action, {
      method: 'POST',
      body: data,
      headers: {
        'Accept': 'application/json'
      }
    });

    if (response.ok) {
      statusBox.textContent = 'Thank you! Your message has been sent.';
      statusBox.className = 'mb-space-md p-space-md rounded-lg text-sm text-center font-medium bg-primary/10 border border-primary/30 text-primary transition-all duration-300';
      form.reset();
      submitIcon.textContent = 'check_circle';
      submitText.textContent = 'Sent Successfully';
      setTimeout(() => {
        submitBtn.disabled = false;
        submitIcon.textContent = 'send';
        submitText.textContent = 'Send Message';
      }, 4000);
    } else {
      const errorData = await response.json();
      let errorMsg = 'Oops! There was a problem submitting your form.';
      if (errorData && errorData.errors) {
        errorMsg = errorData.errors.map(err => err.message).join(', ');
      }
      statusBox.textContent = errorMsg;
      statusBox.className = 'mb-space-md p-space-md rounded-lg text-sm text-center font-medium bg-error/10 border border-error/30 text-error transition-all duration-300';
      submitBtn.disabled = false;
      submitIcon.textContent = 'send';
      submitText.textContent = 'Send Message';
    }
  } catch (error) {
    statusBox.textContent = 'Oops! An error occurred while submitting your message. Please try again.';
    statusBox.className = 'mb-space-md p-space-md rounded-lg text-sm text-center font-medium bg-error/10 border border-error/30 text-error transition-all duration-300';
    submitBtn.disabled = false;
    submitIcon.textContent = 'send';
    submitText.textContent = 'Send Message';
  }
});</script></div></section></main><footer class="w-full bg-[#070d16] mt-space-xl"><div class="w-full px-margin-mobile md:px-margin lg:px-margin-desktop py-space-xl"><div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-gutter pb-space-lg"><div class="space-y-space-xs"><div class="flex items-center gap-space-sm"><div class="w-6 h-6 rounded-md bg-surface-elevated flex items-center justify-center text-primary"></div></div></div><div class="flex flex-col sm:flex-row items-start sm:items-center gap-gutter"><div class="flex items-center gap-space-md"><a class="font-label-md text-label-md text-primary hover:text-accent-electric transition-colors flex items-center gap-space-xs" href="mailto:kilvertm@gmail.com"><span class="material-symbols-outlined text-[16px]">mail</span>kilvertm@gmail.com</a></div><div class="flex items-center gap-space-md text-on-surface-variant"><a class="hover:text-primary transition-colors font-label-md text-label-md uppercase tracking-wider" href="https://vimeo.com/user262273845" target="_blank">Vimeo</a><span class="text-border-subtle">•</span><span class="font-label-md text-label-md uppercase tracking-wider pointer-events-none text-text-muted/40">YouTube</span><span class="text-border-subtle">•</span><a class="hover:text-primary transition-colors font-label-md text-label-md uppercase tracking-wider" href="https://www.linkedin.com/in/kilvert/" target="_blank">LinkedIn</a><span class="text-border-subtle">•</span><a class="hover:text-primary transition-colors font-label-md text-label-md uppercase tracking-wider" href="https://www.instagram.com/kilvert.fx/" target="_blank">Instagram</a></div></div></div><div class="pt-space-md flex flex-col sm:flex-row items-center justify-between gap-space-sm"><div class="flex items-center gap-gutter-sm"></div></div></div></footer>
